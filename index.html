d": "c3-s4-05", "text": "مثلا اگه هدفت اینه که درآمد ماهانه‌ت به چهل تا شصت میلیون برسه، این می‌شه یه هدف مشخص.", "t": [0.0316, 0.0883, 0.1341, 0.1908, 0.2475, 0.2824, 0.35, 0.4394, 0.4743, 0.5201, 0.555, 0.6008, 0.6793, 0.736, 0.7818, 0.8385, 0.8734, 0.9192, 0.9759]}, {"id": "c3-s4-06", "text": "پس هدف سه تا ویژگی داره.", "t": [0.0879, 0.193, 0.331, 0.4362, 0.5413, 0.745, 0.9159]}, {"id": "c3-s4-07", "text": "یک، عدد داشته باشه؛ یعنی قابل اندازه‌گیری باشه.", "t": [0.0513, 0.2098, 0.2744, 0.3698, 0.4929, 0.5832, 0.6735, 0.868, 0.9584]}, {"id": "c3-s4-08", "text": "دو، زمان داشته باشه؛ یعنی یه بازه‌ی زمانی مشخص برای رسیدن بهش داشته باشی.", "t": [0.0291, 0.1288, 0.187, 0.2564, 0.3378, 0.3991, 0.4368, 0.5099, 0.583, 0.6443, 0.7056, 0.7787, 0.8282, 0.9013, 0.9626]}, {"id": "c3-s4-09", "text": "سه، نتیجه‌ی واضح داشته باشه؛ یعنی نتیجه‌ی نهاییش کاملا مشخص باشه، و بتونی تصورش کنی.", "t": [0.0272, 0.1143, 0.1927, 0.2492, 0.3167, 0.3733, 0.4298, 0.5081, 0.5865, 0.6539, 0.7105, 0.7671, 0.791, 0.8584, 0.9259, 0.9716]}, {"id": "c3-s4-10", "text": "هدف وقتی مشخص می‌شه که عدد داشته باشه، زمان داشته باشه، و نتیجه‌ی واضح داشته باشه.", "t": [0.0339, 0.0838, 0.1456, 0.2074, 0.2692, 0.3072, 0.3571, 0.4308, 0.4926, 0.5544, 0.6281, 0.7066, 0.7294, 0.8042, 0.8581, 0.9225, 0.9765]}]}, {"id": "c3-s5", "ch": 3, "title": "بهای هدف", "eyebrow": "فصل سوم · قلهٔ هدف", "lines": [{"id": "c3-s5-01", "text": "حالا یه نکته‌ی مهم‌تر: هر هدفی یه بهایی داره. هیچ هدفی بدون بها به دست نمیاد.", "t": [0.0, 0.0658, 0.1062, 0.1847, 0.3219, 0.3546, 0.4077, 0.4404, 0.5038, 0.6258, 0.6711, 0.7272, 0.7832, 0.8285, 0.863, 0.9083, 0.9751]}, {"id": "c3-s5-02", "text": "سؤال اینه که بهای این هدف چیه؟", "t": [0.0624, 0.2053, 0.3481, 0.436, 0.5788, 0.6942, 0.8096, 0.9249]}, {"id": "c3-s5-03", "text": "یک، وقت گذاشتن؛ اولش دو تا سه ساعت برای تجارتت وقت بذار.", "t": [0.0338, 0.1582, 0.2242, 0.4047, 0.4733, 0.5155, 0.5577, 0.5999, 0.6685, 0.7371, 0.832, 0.8874, 0.956]}, {"id": "c3-s5-04", "text": "دو، یاد گرفتن؛ روزی حداقل نیم ساعت برای آموزش وقت بذار.", "t": [0.0382, 0.1548, 0.2295, 0.4022, 0.4722, 0.5556, 0.6121, 0.6821, 0.752, 0.8354, 0.8919, 0.9619]}, {"id": "c3-s5-05", "text": "سه، اقدام کردن؛ روزی دو تا سه تا گفت‌وگو انجام بده.", "t": [0.0388, 0.1821, 0.2931, 0.4579, 0.531, 0.576, 0.621, 0.666, 0.711, 0.8123, 0.8994, 0.9585]}, {"id": "c3-s5-06", "text": "چهار، پیگیری کردن؛ برای کسایی که وارد گروه فروشت شدن، دو تا سه تا گفت‌وگو انجام بده.", "t": [0.0272, 0.1375, 0.2184, 0.3246, 0.3756, 0.4364, 0.4678, 0.5187, 0.5697, 0.6305, 0.6717, 0.7031, 0.7345, 0.7659, 0.7973, 0.8679, 0.9287, 0.9699]}, {"id": "c3-s5-07", "text": "اگه کسی هدف بزرگ می‌خواد، ولی حاضر نیست بهاش رو بده، در واقع هنوز تصمیم نگرفته.", "t": [0.0312, 0.0812, 0.1312, 0.1813, 0.2432, 0.3289, 0.3789, 0.4409, 0.5028, 0.5647, 0.6028, 0.6528, 0.6909, 0.7528, 0.8148, 0.8886, 0.9743]}]}, {"id": "c3-s6", "ch": 3, "title": "این هدف قابل رسیدن است", "eyebrow": "فصل سوم · قلهٔ هدف", "lines": [{"id": "c3-s6-01", "text": "قبل از اینکه درباره‌ی روش رسیدن حرف بزنیم، بذار یه چیز رو روشن کنم: این هدف قابل رسیدنه. واقعا قابل رسیدنه.", "t": [0.0, 0.0378, 0.0666, 0.1224, 0.1961, 0.2339, 0.2897, 0.3275, 0.3833, 0.4301, 0.4588, 0.4966, 0.5254, 0.5722, 0.6291, 0.652, 0.6748, 0.7031, 0.7815, 0.8465, 0.901, 0.9764]}, {"id": "c3-s6-02", "text": "خیلی‌ها می‌پرسن: امکان داره من موفق بشم؟", "t": [0.074, 0.2254, 0.446, 0.5789, 0.6904, 0.759, 0.8705, 0.9605]}, {"id": "c3-s6-03", "text": "جوابش روشنه: آره، امکان داره. ولی امکان داشتن با اتفاق افتادن فرق داره. با آرزو نه؛ با اقدام.", "t": [0.0154, 0.0745, 0.1647, 0.227, 0.2713, 0.332, 0.3695, 0.4249, 0.4804, 0.509, 0.5644, 0.6288, 0.6663, 0.7532, 0.7811, 0.8263, 0.8871, 0.9179, 0.9776]}, {"id": "c3-s6-04", "text": "اگه یه نفر تونسته به هدفش برسه، پس تو هم می‌تونی برسی. امکان داره موفق بشی، ولی اقدام می‌خواد.", "t": [0.0289, 0.0666, 0.0954, 0.1331, 0.1977, 0.2265, 0.2732, 0.3199, 0.3486, 0.3774, 0.4061, 0.4708, 0.5669, 0.6308, 0.6843, 0.7378, 0.7955, 0.8388, 0.9028, 0.9771]}, {"id": "c3-s6-05", "text": "آدمی که هدف مشخص داره، حرکتش جدی‌تره، تصمیمش محکم‌تره، و دوومش بیشتره.", "t": [0.0275, 0.0965, 0.1389, 0.1946, 0.2635, 0.3325, 0.4147, 0.548, 0.6458, 0.7571, 0.787, 0.8712, 0.969]}, {"id": "c3-s6-06", "text": "و بعد از اینکه هدفت رو مشخص کردی، باید بگی حاضری براش چی‌کار کنی.", "t": [0.0438, 0.0743, 0.1326, 0.177, 0.2631, 0.3353, 0.3797, 0.4519, 0.5241, 0.5963, 0.6546, 0.7407, 0.8128, 0.8989, 0.9572]}, {"id": "c3-s6-07", "text": "پس بگو: هدفت چیه؟ و حاضری برای رسیدن بهش، روزی چند ساعت فعالیت کنی؟", "t": [0.0339, 0.0708, 0.1572, 0.2406, 0.3513, 0.3787, 0.4559, 0.5207, 0.598, 0.6503, 0.7151, 0.7675, 0.8323, 0.922, 0.9743]}]}, {"id": "c3-end", "ch": 3, "title": "دستاورد این فصل", "eyebrow": "فصل سوم · قلهٔ هدف", "lines": [{"id": "c3-end-01", "text": "حالا تو با نوشتن یه هدف مشخص و دقیق، به گروه سه درصدی‌ها پیوستی؛ و حاضری هر روز، با اقدام متمرکز، بهاش رو بدی.", "t": [0.0, 0.0449, 0.0726, 0.1003, 0.1539, 0.1815, 0.2178, 0.2628, 0.2818, 0.3268, 0.3544, 0.3994, 0.427, 0.4979, 0.5795, 0.5993, 0.655, 0.6838, 0.7216, 0.7503, 0.8061, 0.8708, 0.9175, 0.9463, 0.9841]}]}, {"id": "c4-s1", "ch": 4, "title": "ورود به میدان انتخاب", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s1-01", "text": "لیست یعنی جریان کار.", "t": [0.0, 0.2214, 0.4429, 0.7069, 0.8857]}, {"id": "c4-s1-02", "text": "یعنی مواد اولیه‌ی گفت‌وگوهات.", "t": [0.0611, 0.2238, 0.3864, 0.6117, 0.9308]}, {"id": "c4-s1-03", "text": "یعنی مسیر رسیدن به نتیجه.", "t": [0.0452, 0.2165, 0.3879, 0.5922, 0.6976, 0.9019]}, {"id": "c4-s1-04", "text": "این ده تا نکته‌ای که الان بهت می‌گم، نگاهت رو درست می‌کنه، و باعث می‌شه لیست نوشتن و اقدام کردن برات ساده و طبیعی بشه.", "t": [0.0177, 0.0519, 0.0779, 0.104, 0.1626, 0.1886, 0.231, 0.2652, 0.3075, 0.358, 0.3841, 0.4264, 0.4769, 0.4948, 0.5372, 0.5795, 0.6218, 0.6723, 0.6902, 0.7407, 0.7831, 0.8254, 0.8677, 0.8857, 0.9361, 0.9703]}]}, {"id": "c4-s2", "ch": 4, "title": "لیست گسترده نشونه جدیتته", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s2-01", "text": "نکته‌ی اول: لیست گسترده یعنی تو جدی هستی.", "t": [0.0, 0.1311, 0.2497, 0.3708, 0.5386, 0.6597, 0.7343, 0.8321, 0.9533]}, {"id": "c4-s2-02", "text": "یعنی فقط هیجان نداری؛ تصمیم داری.", "t": [0.0855, 0.2139, 0.3175, 0.4706, 0.6663, 0.824, 0.9562]}, {"id": "c4-s2-03", "text": "کسی که لیست نمی‌نویسه، معمولا هنوز وارد «عمل» نشده. ولی کسی که می‌نویسه، یعنی آماده‌ی حرکت شده.", "t": [0.0281, 0.0626, 0.0889, 0.1317, 0.2073, 0.2665, 0.3093, 0.352, 0.403, 0.5522, 0.602, 0.6518, 0.6897, 0.8009, 0.8434, 0.9023, 0.9448, 0.9791]}, {"id": "c4-s2-04", "text": "پس لیست گسترده یه کار اضافه نیست؛ نشونه‌ی جدیت توئه.", "t": [0.0511, 0.1012, 0.1825, 0.2952, 0.3452, 0.4109, 0.5079, 0.6283, 0.767, 0.8671, 0.9673]}]}, {"id": "c4-s3", "ch": 4, "title": "و ۳) قضاوت و فرصت ازدست‌رفته", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s3-01", "text": "نکته‌ی دوم: قضاوت، توی کسب‌وکار بزرگ‌ترین مانع رشده.", "t": [0.0, 0.1318, 0.2817, 0.3916, 0.4661, 0.6115, 0.7746, 0.8668, 0.959]}, {"id": "c4-s3-02", "text": "قضاوت یعنی قبل از اینکه با کسی گفت‌وگو کنی، خودت به جاش تصمیم بگیری.", "t": [0.0452, 0.1276, 0.1967, 0.2525, 0.2951, 0.3775, 0.42, 0.4758, 0.5715, 0.6273, 0.6964, 0.7389, 0.7947, 0.8771, 0.9595]}, {"id": "c4-s3-03", "text": "این نمی‌تونه. این وقت نداره. این پول نداره. این اهلش نیست. این خانواده‌ش نمی‌ذارن.", "t": [0.0341, 0.0819, 0.2058, 0.2546, 0.3034, 0.3755, 0.4243, 0.4731, 0.5452, 0.594, 0.6545, 0.7149, 0.7638, 0.8707, 0.966]}, {"id": "c4-s3-04", "text": "اینا همه‌ش قضاوته. و قضاوت دقیقا همون چیزیه که جلوی رشد رو می‌گیره.", "t": [0.0351, 0.1123, 0.1895, 0.3239, 0.3526, 0.4336, 0.5146, 0.5825, 0.6635, 0.7053, 0.7732, 0.828, 0.8698, 0.9638]}, {"id": "c4-s3-05", "text": "اینجا یه قانون طلایی داریم: کسی که فکرش رو نمی‌کنی، کاری می‌کنه که فکرش رو نمی‌کنی.", "t": [0.0303, 0.0961, 0.1301, 0.196, 0.2619, 0.3449, 0.3991, 0.4404, 0.5075, 0.5488, 0.6593, 0.7134, 0.778, 0.8113, 0.8655, 0.8988, 0.9738]}, {"id": "c4-s3-06", "text": "یعنی ممکنه همون آدمی که اصلا روش حساب نمی‌کنی، لیدر اصلی تیمت بشه.", "t": [0.0318, 0.1052, 0.1927, 0.2661, 0.3395, 0.3847, 0.4581, 0.5173, 0.5907, 0.6924, 0.7658, 0.8392, 0.9126, 0.9719]}, {"id": "c4-s3-07", "text": "پس کار تو قضاوت نیست؛ کار تو گفت‌وگو و معرفی فرصته.", "t": [0.0312, 0.0816, 0.1477, 0.198, 0.2956, 0.4186, 0.494, 0.5514, 0.6805, 0.72, 0.8312, 0.9424]}, {"id": "c4-s3-08", "text": "نکته‌ی سوم: اونی که فرصت رو بهش نمی‌دی، ممکنه بره توی تیم یکی دیگه.", "t": [0.0507, 0.1584, 0.3059, 0.3682, 0.4065, 0.4688, 0.5071, 0.5574, 0.6317, 0.7059, 0.7562, 0.8065, 0.8568, 0.9071, 0.9694]}, {"id": "c4-s3-09", "text": "این خیلی واقعیه. به یه نفر نمی‌گی…  بعد از یه مدت می‌بینی همون آدم رفته توی تیم یکی دیگه، شروع کرده، رشد کرده.", "t": [0.0227, 0.0628, 0.1126, 0.2156, 0.2424, 0.2692, 0.3043, 0.3563, 0.3915, 0.4183, 0.4451, 0.4802, 0.5405, 0.5841, 0.6193, 0.6628, 0.698, 0.7332, 0.7684, 0.8119, 0.8555, 0.899, 0.9342, 0.9778]}, {"id": "c4-s3-10", "text": "نه چون تو بد بودی؛ فقط چون تو فرصت رو بهش نگفتی.", "t": [0.0404, 0.0957, 0.1683, 0.2236, 0.2789, 0.4353, 0.5067, 0.578, 0.6324, 0.7208, 0.7752, 0.8466, 0.9519]}, {"id": "c4-s3-11", "text": "پس این یه جمله یادت باشه: اگه من بهش نگم، احتمال داره یه نفر دیگه بگه.", "t": [0.0345, 0.068, 0.1119, 0.1454, 0.1997, 0.2541, 0.3694, 0.4369, 0.4882, 0.5556, 0.6449, 0.7249, 0.7827, 0.8183, 0.865, 0.9227, 0.9694]}]}, {"id": "c4-s4", "ch": 4, "title": "مثال صفحه شطرنج — چرا باید سریع و زیاد اقدام کنیم؟", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s4-01", "text": "نکته‌ی چهارم رو با یه مثال می‌گم: مثال صفحه‌ی شطرنج. اینکه چرا باید سریع و زیاد اقدام کنیم.", "t": [0.0, 0.0596, 0.1191, 0.1499, 0.1806, 0.2114, 0.2613, 0.3605, 0.4169, 0.4842, 0.5664, 0.6289, 0.6713, 0.7238, 0.7763, 0.7985, 0.8509, 0.9135, 0.966]}, {"id": "c4-s4-02", "text": "تصور کن یه صفحه‌ی شطرنج داریم. می‌دونی توی یکی از خونه‌هاش ده میلیارد پول هست، و بقیه‌ی خونه‌ها پوچه.", "t": [0.0249, 0.0702, 0.098, 0.1258, 0.1798, 0.2337, 0.3407, 0.4075, 0.4464, 0.4854, 0.5151, 0.5911, 0.6208, 0.6968, 0.7358, 0.7747, 0.7951, 0.8527, 0.9194, 0.9677]}, {"id": "c4-s4-03", "text": "حالا دو مدل بازی بهت پیشنهاد می‌دن.", "t": [0.0736, 0.1957, 0.2709, 0.3695, 0.4916, 0.5902, 0.7828, 0.9049]}, {"id": "c4-s4-04", "text": "راه اول: فقط اجازه داری پنج تا خونه رو انتخاب کنی. راه دوم: فقط دو دقیقه وقت داری که خونه به خونه بری و انتخاب کنی.", "t": [0.0228, 0.0581, 0.1376, 0.1647, 0.2048, 0.2384, 0.2655, 0.2862, 0.3198, 0.3405, 0.387, 0.4691, 0.5012, 0.5334, 0.5656, 0.5901, 0.6376, 0.6698, 0.7097, 0.7342, 0.7741, 0.7986, 0.8384, 0.8706, 0.8875, 0.9426, 0.9748]}, {"id": "c4-s4-05", "text": "کدوم راه بهتره؟ کاملا معلومه: راه دوم.", "t": [0.0449, 0.1247, 0.1892, 0.378, 0.5151, 0.7052, 0.8233, 0.9413]}, {"id": "c4-s4-06", "text": "چرا؟ چون هر چی تعداد انتخاب‌هات بیشتر بشه، احتمال اینکه به اون خونه‌ی پولدار برسی بالاتر می‌ره.", "t": [0.0255, 0.1318, 0.1584, 0.1786, 0.1989, 0.2381, 0.3027, 0.3419, 0.3831, 0.4645, 0.5346, 0.5707, 0.6182, 0.6883, 0.7697, 0.8284, 0.9098, 0.9686]}, {"id": "c4-s4-07", "text": "توی این کار هم دقیقا همینه. تو نمی‌دونی کدوم آدم، «خونه‌ی ده میلیاردی» توئه.", "t": [0.0291, 0.0776, 0.1262, 0.1747, 0.2117, 0.2834, 0.4077, 0.4491, 0.5552, 0.6226, 0.6953, 0.7646, 0.8003, 0.9031, 0.9612]}, {"id": "c4-s4-08", "text": "پس بهترین کار اینه که سریع‌تر بری سمت لیستت، بیشتر گفت‌وگو کنی و تعداد مکالمه‌هات رو به حداکثر برسونی، و اقدامت رو زیاد کنی.", "t": [0.019, 0.0439, 0.0997, 0.1323, 0.1726, 0.1975, 0.2533, 0.2859, 0.3185, 0.3666, 0.4147, 0.4705, 0.5031, 0.5202, 0.5683, 0.6474, 0.6722, 0.6971, 0.7529, 0.8088, 0.8258, 0.8817, 0.9065, 0.9468, 0.9794]}, {"id": "c4-s4-09", "text": "هر چی دیرتر و کمتر حرکت کنی، احتمال بردت رو کم می‌کنی.", "t": [0.03, 0.0849, 0.1398, 0.246, 0.2838, 0.3729, 0.4621, 0.5341, 0.6575, 0.7467, 0.8015, 0.8564, 0.9627]}, {"id": "c4-s4-10", "text": "هر چی سریع‌تر و بیشتر حرکت کنی، موفقیتت تضمین‌شده‌تر می‌شه.", "t": [0.0266, 0.0804, 0.1343, 0.2556, 0.2926, 0.397, 0.4846, 0.5553, 0.6933, 0.8819, 0.9695]}]}, {"id": "c4-s5", "ch": 4, "title": "شروع کار مثل یک قیفه", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s5-01", "text": "نکته‌ی پنجم: شروع کار مثل یه قیفه.", "t": [0.0, 0.1711, 0.3986, 0.5248, 0.6267, 0.7286, 0.8062, 0.9324]}, {"id": "c4-s5-02", "text": "ورودی قیف، گفت‌وگوهاست؛ و خروجیش، آدم‌هایی که آماده‌ی شروع‌ان.", "t": [0.0416, 0.1465, 0.2176, 0.4465, 0.4784, 0.5827, 0.7016, 0.7479, 0.8523, 0.9566]}, {"id": "c4-s5-03", "text": "ورودی این قیف معمولا پنجاه تا هفتاد تا گفت‌وگوئه.", "t": [0.0616, 0.1716, 0.246, 0.3205, 0.4482, 0.5581, 0.6148, 0.7248, 0.7815, 0.9446]}, {"id": "c4-s5-04", "text": "و خروجیش معمولا اینه: چهار تا پنج نفر که واقعا آماده‌ی شروع کارن و شروع فعال دارن.", "t": [0.0266, 0.0476, 0.1163, 0.1851, 0.2562, 0.3169, 0.3542, 0.4033, 0.4523, 0.4896, 0.562, 0.646, 0.7067, 0.7674, 0.7931, 0.8538, 0.9145, 0.9752]}, {"id": "c4-s5-05", "text": "و ده تا پونزده نفر که مشتری محصولاتت می‌شن.", "t": [0.0478, 0.0923, 0.157, 0.2217, 0.3673, 0.4522, 0.5169, 0.6423, 0.8284, 0.9335]}, {"id": "c4-s5-06", "text": "بقیه چی؟ بقیه می‌رن توی لیست «بعدا بله». یعنی یا بعدا کار رو شروع می‌کنن، یا محصولات رو استفاده می‌کنن، یا الان زمانش نیست براشون.", "t": [0.0206, 0.0669, 0.1283, 0.1707, 0.213, 0.2472, 0.2896, 0.332, 0.4043, 0.438, 0.4587, 0.4924, 0.5196, 0.5404, 0.5741, 0.6143, 0.635, 0.6882, 0.7089, 0.762, 0.8022, 0.823, 0.8567, 0.8968, 0.9305, 0.9772]}, {"id": "c4-s5-07", "text": "پس اینجا یه نکته‌ی خیلی مهم هست: قرار نیست فشار اضافه بیاریم. قرار نیست کسی رو زورکی وارد کنیم.", "t": [0.0274, 0.057, 0.1145, 0.1441, 0.2015, 0.2497, 0.2886, 0.367, 0.4128, 0.4586, 0.5044, 0.559, 0.6702, 0.7166, 0.7629, 0.8003, 0.8289, 0.8841, 0.9304, 0.9768]}, {"id": "c4-s5-08", "text": "قرار نیست کسی رو مجبور کنیم محصول بگیره یا کار رو شروع کنه.", "t": [0.0338, 0.1118, 0.1898, 0.2528, 0.3008, 0.3938, 0.4718, 0.5647, 0.6577, 0.7057, 0.7687, 0.8167, 0.8947, 0.9577]}, {"id": "c4-s5-09", "text": "ما فرصت رو معرفی می‌کنیم؛ قیف کار خودش رو می‌کنه.", "t": [0.0436, 0.0992, 0.1896, 0.2453, 0.3531, 0.572, 0.6418, 0.7116, 0.7981, 0.8513, 0.9543]}, {"id": "c4-s5-10", "text": "و یه نکته‌ی کلیدی: اگه به کسی فرصت درآمدی رو پیشنهاد دادیم و آماده نبود، می‌تونیم استفاده از محصولات رو بهش پیشنهاد بدیم.", "t": [0.0222, 0.0381, 0.0613, 0.1061, 0.1875, 0.2195, 0.2439, 0.2759, 0.3156, 0.3705, 0.3949, 0.4574, 0.5046, 0.5214, 0.5687, 0.6083, 0.6709, 0.7334, 0.7578, 0.8203, 0.8447, 0.8767, 0.9393, 0.9789]}, {"id": "c4-s5-11", "text": "یعنی آدم‌ها حذف نمی‌شن؛ فقط مسیرشون فرق می‌کنه.", "t": [0.0443, 0.1511, 0.2784, 0.3647, 0.492, 0.5783, 0.7467, 0.833, 0.9603]}]}, {"id": "c4-s6", "ch": 4, "title": "نه رو شخصی نکن", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s6-01", "text": "نکته‌ی ششم: «نه» رو شخصی نکن.", "t": [0.0, 0.1934, 0.4494, 0.5529, 0.6564, 0.8247, 0.9605]}, {"id": "c4-s6-02", "text": "نه شنیدن طبیعیه. ولی خیلی‌ها «نه» رو اشتباه معنی می‌کنن.", "t": [0.0477, 0.1118, 0.2359, 0.4747, 0.531, 0.6276, 0.6705, 0.7134, 0.81, 0.8797, 0.9628]}, {"id": "c4-s6-03", "text": "«نه» یعنی الان زمانش نیست. یعنی الان اولویتش نیست. یعنی الان آماده‌ی تصمیم نیست.", "t": [0.0363, 0.1524, 0.1958, 0.2392, 0.291, 0.3633, 0.4239, 0.4845, 0.5801, 0.6749, 0.7299, 0.7849, 0.8611, 0.9267, 0.9817]}, {"id": "c4-s6-04", "text": "ممکنه تو الان توی باشگاه ثبت‌نام نکنی. معنیش این نیست که باشگاه بده، یا ورزشکارها بدن.", "t": [0.0368, 0.0996, 0.132, 0.1846, 0.2271, 0.3, 0.3729, 0.4686, 0.5348, 0.5796, 0.6351, 0.6693, 0.7462, 0.791, 0.8252, 0.9341, 0.9789]}, {"id": "c4-s6-05", "text": "فقط تصمیم امروزت اینه که ثبت‌نام نکنی. شاید بعدا ثبت‌نام کنی. کار ما هم همینه.", "t": [0.0385, 0.0861, 0.1563, 0.2379, 0.2969, 0.3331, 0.4147, 0.5204, 0.5812, 0.6419, 0.726, 0.8202, 0.8594, 0.8893, 0.9192, 0.9772]}, {"id": "c4-s6-06", "text": "پس اگه اقدام کردی و «نه» شنیدی، این «نه» هیچ ربطی به ارزش تو نداره، هیچ ربطی به حرفه‌ت نداره؛ فقط یعنی الان زمان مناسبی برای اون آدم نیست.", "t": [0.0212, 0.0523, 0.0932, 0.1534, 0.204, 0.2254, 0.2672, 0.3011, 0.324, 0.3415, 0.3645, 0.393, 0.4105, 0.4389, 0.4564, 0.5074, 0.5335, 0.5657, 0.5856, 0.6241, 0.6885, 0.7158, 0.7495, 0.7833, 0.817, 0.8638, 0.8975, 0.9248, 0.952, 0.9858]}]}, {"id": "c4-s7", "ch": 4, "title": "طبیعت هر بیزنسی اینه که به همه بگی", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s7-01", "text": "نکته‌ی هفتم: طبیعت هر بیزینسی اینه که به همه بگی.", "t": [0.0, 0.1363, 0.3309, 0.4337, 0.4867, 0.6227, 0.7089, 0.762, 0.8151, 0.8847, 0.9543]}, {"id": "c4-s7-02", "text": "توی هر بیزینسی، به همه گفته می‌شه.", "t": [0.0768, 0.1866, 0.2703, 0.5188, 0.595, 0.6949, 0.8187, 0.9424]}, {"id": "c4-s7-03", "text": "چون آدم‌ها سه دسته‌ان: یه سری الان آماده‌ان.", "t": [0.0723, 0.1539, 0.2743, 0.3365, 0.5808, 0.6381, 0.7132, 0.8063, 0.9531]}, {"id": "c4-s7-04", "text": "یه سری الان آماده نیستن، ولی بعدا آماده می‌شن.", "t": [0.0545, 0.1181, 0.2017, 0.3051, 0.4284, 0.5517, 0.6352, 0.7386, 0.862, 0.9654]}, {"id": "c4-s7-05", "text": "و یه سری فقط منتظرن یکی بهشون پیشنهاد بده، تا با تمام وجود بیان.", "t": [0.0323, 0.0638, 0.1095, 0.1696, 0.2297, 0.3326, 0.3927, 0.4813, 0.5986, 0.6586, 0.7044, 0.7502, 0.8245, 0.8989, 0.9732]}, {"id": "c4-s7-06", "text": "پس کار درست اینه که به همه بگی. نه برای اینکه همه بگن بله؛ برای اینکه آدمای آماده خودشون پیدا بشن.", "t": [0.0247, 0.0528, 0.0897, 0.1354, 0.181, 0.2091, 0.2372, 0.2741, 0.3462, 0.3742, 0.4197, 0.4739, 0.5106, 0.5474, 0.6189, 0.6659, 0.7219, 0.7778, 0.8338, 0.8988, 0.9458, 0.9837]}, {"id": "c4-s7-07", "text": "یادت باشه، تو داری طلا پیشنهاد می‌دی. اگه کسی الان گفت نه، معنیش رد کردن ارزش تو نیست. با اطمینان کامل به همه پیشنهاد بده.", "t": [0.0162, 0.0562, 0.1058, 0.125, 0.1563, 0.1815, 0.2308, 0.2934, 0.3276, 0.3619, 0.4042, 0.4385, 0.4645, 0.5151, 0.5411, 0.5835, 0.6259, 0.652, 0.7159, 0.7395, 0.7999, 0.8382, 0.8617, 0.8927, 0.9531, 0.984]}]}, {"id": "c4-s8", "ch": 4, "title": "دنبال آدم خاص نباش — لیدرها بعد از ورود مشخص میشن", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s8-01", "text": "نکته‌ی هشتم: دنبال آدم خاص نباش؛ لیدرها بعد از ورود مشخص می‌شن.", "t": [0.0, 0.0961, 0.2458, 0.3404, 0.4045, 0.4686, 0.5808, 0.6722, 0.7255, 0.7661, 0.8321, 0.8981, 0.9641]}, {"id": "c4-s8-02", "text": "خیلی‌ها دنبال «آدم خاص» می‌گردن. می‌گن من فقط دنبال لیدرم. من فقط دنبال آدم پولدارم. من فقط دنبال آدم اجتماعی‌ام.", "t": [0.029, 0.0951, 0.1519, 0.1905, 0.229, 0.3273, 0.3681, 0.3933, 0.4263, 0.475, 0.5554, 0.5792, 0.6105, 0.6567, 0.688, 0.7726, 0.7966, 0.8282, 0.8747, 0.9062, 0.9828]}, {"id": "c4-s8-03", "text": "ولی واقعیت اینه که لیدرها بعد از اینکه وارد کار شدن، مشخص می‌شن.", "t": [0.0362, 0.0964, 0.1997, 0.2742, 0.3201, 0.4234, 0.4836, 0.5295, 0.6184, 0.693, 0.7532, 0.8135, 0.888, 0.9626]}, {"id": "c4-s8-04", "text": "مثلا ممکنه یه نفر روز اول ساکت باشه، ولی وقتی آموزش می‌بینه و رشد می‌کنه، تبدیل بشه به یه لیدر بزرگ.", "t": [0.029, 0.0773, 0.1348, 0.1645, 0.2035, 0.2425, 0.2815, 0.3298, 0.401, 0.4394, 0.487, 0.5438, 0.6097, 0.6298, 0.6683, 0.725, 0.7818, 0.8202, 0.8495, 0.8788, 0.9264, 0.974]}, {"id": "c4-s8-05", "text": "و ممکنه یه نفر روز اول خیلی پرانرژی باشه، ولی بعد از یه هفته خاموش بشه.", "t": [0.0377, 0.0658, 0.145, 0.1859, 0.2396, 0.2933, 0.3469, 0.4133, 0.5181, 0.5845, 0.6382, 0.6919, 0.7328, 0.7736, 0.8401, 0.9193, 0.9729]}, {"id": "c4-s8-06", "text": "پس تو دنبال آدم آماده نمی‌گردی. تو آدم‌ها رو وارد سیستم می‌کنی؛ سیستم لیدر می‌سازه.", "t": [0.0247, 0.0616, 0.0985, 0.17, 0.2184, 0.2899, 0.4183, 0.455, 0.526, 0.5627, 0.6222, 0.6933, 0.7643, 0.8353, 0.8949, 0.9774]}]}, {"id": "c4-s9", "ch": 4, "title": "ارزش کار و محصولت رو بدون و نیتت کمک کردن باشه", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s9-01", "text": "نکته‌ی نهم: ارزش کار و محصولت رو بدون، و نیتت کمک کردن باشه.", "t": [0.0, 0.1084, 0.2519, 0.3186, 0.3725, 0.4008, 0.4932, 0.5342, 0.6265, 0.6608, 0.7418, 0.8072, 0.8882, 0.9692]}, {"id": "c4-s9-02", "text": "تو داری یه فرصت تغییر زندگی معرفی می‌کنی. داری یه راه رشد معرفی می‌کنی. داری یه محصول قابل استفاده معرفی می‌کنی.", "t": [0.0306, 0.0562, 0.0978, 0.1233, 0.1649, 0.2144, 0.2639, 0.3135, 0.3835, 0.4256, 0.4516, 0.4856, 0.5197, 0.57, 0.6366, 0.6806, 0.7077, 0.7602, 0.8042, 0.8736, 0.926, 0.9785]}, {"id": "c4-s9-03", "text": "پس با حس شرمندگی حرف نزن. با ترس حرف نزن. با شک حرف نزن.", "t": [0.0463, 0.0896, 0.133, 0.1764, 0.2876, 0.3445, 0.4407, 0.4903, 0.5555, 0.6206, 0.7157, 0.7705, 0.8254, 0.8974, 0.9694]}, {"id": "c4-s9-04", "text": "وقتی نیتت کمک کردن باشه، لحنت محکم‌تر می‌شه، حرف‌هات طبیعی‌تر می‌شه، و طرف مقابل هم حس می‌کنه تو دنبال فشار آوردن نیستی؛ احساس امنیت می‌کنه.", "t": [0.0232, 0.0697, 0.1162, 0.1538, 0.2003, 0.2468, 0.2934, 0.3578, 0.4132, 0.4523, 0.4968, 0.5251, 0.537, 0.5598, 0.5935, 0.6108, 0.6282, 0.6619, 0.6793, 0.7129, 0.7411, 0.7748, 0.8176, 0.8721, 0.9265, 0.981]}, {"id": "c4-s9-05", "text": "یه مثال ساده: مثل اینه که یه نفر مشکلی داره، و تو واقعا یه راهکار براش داری.", "t": [0.0532, 0.0895, 0.1486, 0.2313, 0.2806, 0.3417, 0.3793, 0.4169, 0.4663, 0.5391, 0.6002, 0.626, 0.6636, 0.7365, 0.7741, 0.8587, 0.9198, 0.9808]}, {"id": "c4-s9-06", "text": "وقتی راهکار داری، با اطمینان پیشنهادش می‌دی؛ نه با خجالت. اینجا هم همینه.", "t": [0.0343, 0.1148, 0.2262, 0.3247, 0.3575, 0.4416, 0.5359, 0.6119, 0.6494, 0.687, 0.7787, 0.8556, 0.8952, 0.972]}]}, {"id": "c4-s10", "ch": 4, "title": "دو اشتباه بزرگ", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s10-01", "text": "و نکته‌ی دهم: دو تا اشتباه بزرگ.", "t": [0.0, 0.061, 0.2329, 0.4257, 0.5105, 0.5953, 0.7861, 0.9239]}, {"id": "c4-s10-02", "text": "اشتباه اول اینه که بعد از اولین جواب‌های مثبت، دست از اقدام بکشی.", "t": [0.0452, 0.1431, 0.2002, 0.2709, 0.3144, 0.3714, 0.4149, 0.4992, 0.6107, 0.7004, 0.7566, 0.7995, 0.8825, 0.9521]}, {"id": "c4-s10-03", "text": "مثلا دو نفر گفتن «آره»، تو ذوق می‌کنی و فکر می‌کنی دیگه تمومه؛ اقدامت کم می‌شه، و کار می‌خوابه. در حالی که اون تازه شروع قیفه.", "t": [0.0238, 0.0612, 0.0841, 0.1143, 0.1517, 0.2134, 0.2337, 0.2603, 0.2996, 0.3136, 0.3402, 0.3796, 0.4126, 0.491, 0.5461, 0.5705, 0.6344, 0.6476, 0.6729, 0.7604, 0.7812, 0.815, 0.8358, 0.8631, 0.8969, 0.9307, 0.9645]}, {"id": "c4-s10-04", "text": "اشتباه دوم اینه که بعد از اولین جواب‌های منفی ناامید بشی.", "t": [0.0608, 0.1721, 0.2369, 0.3173, 0.3667, 0.4316, 0.4811, 0.5769, 0.7036, 0.7839, 0.8952, 0.9601]}, {"id": "c4-s10-05", "text": "چون «نه» بخشی از مسیره. «نه» یعنی داری اقدام می‌کنی. «نه» یعنی توی بازی هستی.", "t": [0.0256, 0.0842, 0.1288, 0.2013, 0.2459, 0.3755, 0.4096, 0.465, 0.5205, 0.5866, 0.6921, 0.7314, 0.7952, 0.8467, 0.9105, 0.9743]}, {"id": "c4-s10-06", "text": "کسی که «نه» نمی‌شنوه، یعنی اصلا بازی نکرده.", "t": [0.0399, 0.1348, 0.207, 0.2793, 0.4644, 0.5818, 0.6993, 0.8167, 0.9567]}]}, {"id": "c4-s11", "ch": 4, "title": "شناخت دو نوع لیست: کلی و پویا", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s11-01", "text": "حالا بریم سراغ خود لیست. ما دو تا لیست داریم.", "t": [0.0, 0.1048, 0.2096, 0.3144, 0.3991, 0.5843, 0.6365, 0.6887, 0.7409, 0.8257, 0.9268]}, {"id": "c4-s11-02", "text": "اولی لیست کلی نفراته. این لیست همه‌ی کسایی رو شامل می‌شه که اسمشون رو می‌دونی؛ حتی اگه مدت زیادی باهاشون در ارتباط نبودی.", "t": [0.0218, 0.0766, 0.1314, 0.1756, 0.2925, 0.3194, 0.3527, 0.386, 0.4257, 0.4462, 0.4795, 0.5129, 0.5333, 0.5795, 0.6, 0.6613, 0.6918, 0.7223, 0.7528, 0.7978, 0.8573, 0.8806, 0.9328, 0.9778]}, {"id": "c4-s11-03", "text": "بدون فیلتر، بدون قضاوت؛ فقط بنویس.", "t": [0.0437, 0.1713, 0.3234, 0.4509, 0.6296, 0.7585, 0.9489]}, {"id": "c4-s11-04", "text": "دومی لیست پویاست. این لیست، بیست نفر از لیست کلیته که برای شروع گفت‌وگو باهاشون راحت‌تری.", "t": [0.0245, 0.0923, 0.16, 0.2981, 0.3381, 0.3876, 0.4371, 0.4771, 0.5076, 0.5571, 0.6161, 0.6466, 0.6961, 0.7456, 0.8141, 0.8922, 0.9703]}, {"id": "c4-s11-05", "text": "نکته‌ی مهم اینه که این لیست همیشه باید بیست نفر بمونه.", "t": [0.048, 0.1499, 0.219, 0.3045, 0.3571, 0.4262, 0.5117, 0.6136, 0.6991, 0.7846, 0.8537, 0.9556]}, {"id": "c4-s11-06", "text": "یعنی اگه با پنج نفر حرف زدی، پنج نفر جدید از لیست بزرگت به لیست پویات اضافه کن.", "t": [0.0217, 0.0826, 0.1318, 0.1693, 0.2186, 0.2678, 0.317, 0.3662, 0.4154, 0.4646, 0.5255, 0.563, 0.624, 0.6966, 0.7341, 0.795, 0.8677, 0.9403, 0.9778]}, {"id": "c4-s11-07", "text": "و دوستای جدید پیدا کن، و اونا رو هم به لیست پویات اضافه کن.", "t": [0.0271, 0.0609, 0.1716, 0.2515, 0.3315, 0.3807, 0.4145, 0.4945, 0.5437, 0.5929, 0.642, 0.722, 0.8173, 0.9126, 0.9618]}]}, {"id": "c4-s12", "ch": 4, "title": "ساخت لیست کلی و انتخاب ۲۰ نفر لیست پویا", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s12-01", "text": "حالا توی این مرحله، اسم آدم‌ها رو به لیست کلیت اضافه کن، و بیست نفر رو برای لیست پویای فعالت انتخاب کن.", "t": [0.0, 0.044, 0.0796, 0.1152, 0.1791, 0.2152, 0.2684, 0.2958, 0.3233, 0.3679, 0.4125, 0.4657, 0.5058, 0.527, 0.5771, 0.6176, 0.6484, 0.6985, 0.7486, 0.8084, 0.8681, 0.9375, 0.9683]}, {"id": "c4-s12-02", "text": "یادت باشه: لیست کلی بدون قضاوت ساخته می‌شه، و لیست پویا، حلقه‌ی بیست‌نفره‌ی اقدام‌هاییه که پیش رو داری.", "t": [0.0231, 0.0709, 0.1567, 0.2071, 0.2479, 0.2983, 0.3584, 0.4185, 0.4883, 0.5076, 0.5533, 0.599, 0.6534, 0.743, 0.8414, 0.8695, 0.9064, 0.9345, 0.9801]}]}, {"id": "c4-s13", "ch": 4, "title": "جمع‌بندی میدان انتخاب و آمادگی برای اولین گفت‌وگو", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-s13-01", "text": "تو دیگه قرار نیست به جای آدم‌ها تصمیم بگیری. لیستت آماده‌ست؛ حالا وقت گفت‌وگوئه.", "t": [0.0, 0.0319, 0.0837, 0.1355, 0.1874, 0.2193, 0.2611, 0.3229, 0.3847, 0.5172, 0.5863, 0.7123, 0.7815, 0.8373, 0.9596]}, {"id": "c4-s13-02", "text": "ده تا دروازه و قانون طلایی جلوی چشمت روشن شد، و لیست پویای بیست‌نفره‌ت آماده‌ست که بری سراغ فصل پنجم.", "t": [0.0321, 0.0621, 0.0921, 0.1597, 0.1804, 0.2386, 0.2968, 0.3456, 0.3944, 0.4432, 0.4733, 0.4939, 0.5427, 0.6009, 0.6967, 0.7737, 0.8037, 0.8432, 0.892, 0.9314, 0.9802]}]}, {"id": "c4-end", "ch": 4, "title": "دستاورد این فصل", "eyebrow": "فصل چهارم · میدان انتخاب", "lines": [{"id": "c4-end-01", "text": "حالا بدون اینکه آدم‌ها رو قضاوت کنی، لیست پویای بیست‌نفره‌ت آماده‌ست؛ و با تعداد اقدام بالا، و بدون وابستگی به نتیجه، حرکت می‌کنی.", "t": [0.0, 0.038, 0.076, 0.1213, 0.1665, 0.1899, 0.2352, 0.2659, 0.3039, 0.3492, 0.4237, 0.4979, 0.5159, 0.5422, 0.593, 0.6438, 0.6864, 0.7044, 0.747, 0.8142, 0.8404, 0.8912, 0.9338, 0.9846]}]}, {"id": "c5-s1", "ch": 5, "title": "لحظهٔ اقدام", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s1-01", "text": "تا اینجا درباره‌ی هدف حرف زدیم. درباره‌ی لیست حرف زدیم. درباره‌ی نگرش درست حرف زدیم.", "t": [0.0, 0.0327, 0.0961, 0.1799, 0.2229, 0.2658, 0.3784, 0.4584, 0.5092, 0.5502, 0.6636, 0.7526, 0.809, 0.8653, 0.9109, 0.9673]}, {"id": "c5-s1-02", "text": "حالا وقت اقدامه.", "t": [0.0742, 0.3324, 0.541, 0.8985]}, {"id": "c5-s1-03", "text": "اگه همین‌جا اقدام نکنی، همه‌چیز توی ذهنت می‌مونه. و ذهن بدون عمل، نتیجه نمی‌سازه.", "t": [0.0223, 0.0667, 0.1428, 0.2083, 0.2633, 0.3394, 0.3838, 0.4387, 0.5704, 0.599, 0.6535, 0.7211, 0.7757, 0.8562, 0.9627]}, {"id": "c5-s1-04", "text": "مسیر اقدام چهار تا قدم داره.", "t": [0.0784, 0.2286, 0.4077, 0.5579, 0.6503, 0.7716, 0.9218]}, {"id": "c5-s1-05", "text": "یک، لیست بیست‌نفره؛ یعنی یه فهرست هدفمند از آدم‌هایی که می‌خوای باهاشون حرف بزنی.", "t": [0.0222, 0.1229, 0.1796, 0.324, 0.3793, 0.4133, 0.4793, 0.5558, 0.5899, 0.6771, 0.7111, 0.7877, 0.8749, 0.9196, 0.9749]}, {"id": "c5-s1-06", "text": "دو، آموزش گفت‌وگو؛ یعنی تمرین پیام و سؤال‌های اولیه.", "t": [0.0274, 0.0796, 0.1808, 0.3638, 0.4562, 0.5664, 0.6588, 0.6979, 0.8436, 0.9538]}, {"id": "c5-s1-07", "text": "سه، تنظیم قرار؛ یعنی هماهنگ کردن زمان ملاقات یا تماس.", "t": [0.0243, 0.1598, 0.2746, 0.4211, 0.496, 0.5998, 0.6747, 0.7497, 0.8534, 0.8996, 0.9745]}, {"id": "c5-s1-08", "text": "و چهار، پیگیری قطعی؛ یعنی تأیید و پیگیری بعد از ملاقات.", "t": [0.0, 0.0436, 0.1857, 0.3237, 0.4778, 0.55, 0.6361, 0.6666, 0.7666, 0.825, 0.8694, 0.9694]}]}, {"id": "c5-s2", "ch": 5, "title": "قدم اول: همین الان لیست ۲۰ نفره بنویس", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s2-01", "text": "قدم اول: همین الان، همین‌جا، یه لیست بیست‌نفره بنویس، از کسایی که برای شروع گفت‌وگو باهاشون راحت‌تری.", "t": [0.0, 0.0479, 0.1148, 0.1148, 0.139, 0.2162, 0.2504, 0.3062, 0.4048, 0.4712, 0.5055, 0.5719, 0.6062, 0.662, 0.7177, 0.7949, 0.8827, 0.9706]}, {"id": "c5-s2-02", "text": "نه بهترین‌ها. نه پولدارترین‌ها. نه خاص‌ترین‌ها. فقط کسایی که راحت‌تری باهاشون حرف بزنی.", "t": [0.0365, 0.0685, 0.2047, 0.2367, 0.4103, 0.4466, 0.5812, 0.6225, 0.6835, 0.715, 0.7957, 0.8764, 0.9177, 0.9688]}, {"id": "c5-s2-03", "text": "هیچ فیلتری وجود نداره. قرار نیست انتخاب کنی کی خوبه، کی بده. قراره به همه بگیم.", "t": [0.0375, 0.0817, 0.1573, 0.2119, 0.3251, 0.3926, 0.4601, 0.5536, 0.6081, 0.6496, 0.768, 0.7923, 0.8242, 0.8713, 0.8956, 0.9275, 0.967]}, {"id": "c5-s2-04", "text": "بدون قضاوت؛ قرار نیست بسنجی کی میاد و کی نمیاد. فقط بنویس.", "t": [0.0434, 0.1277, 0.2715, 0.3375, 0.4035, 0.4822, 0.5228, 0.5889, 0.6168, 0.6574, 0.7885, 0.8613, 0.9688]}, {"id": "c5-s2-05", "text": "الان اسم‌ها رو یکی‌یکی بگو. تا بیست تا کامل نشه، بلند نمی‌شیم. چون این شروع جدی توئه.", "t": [0.0297, 0.0793, 0.1384, 0.1689, 0.2376, 0.3287, 0.3801, 0.4635, 0.5149, 0.5984, 0.703, 0.7431, 0.7987, 0.8311, 0.8635, 0.9036, 0.936, 0.9761]}, {"id": "c5-s2-06", "text": "و لیست پویات رو زنده نگه دار: بعد از هر گفت‌وگو، یه نفر جدید بهش اضافه کن.", "t": [0.0335, 0.0581, 0.1163, 0.1856, 0.2213, 0.2795, 0.3264, 0.4307, 0.4839, 0.5243, 0.5648, 0.6749, 0.7111, 0.7586, 0.8174, 0.865, 0.9351, 0.9713]}]}, {"id": "c5-s3", "ch": 5, "title": "قدم دوم: بیا همین الان یاد بگیریم چطور به ۳-۴ نفر اول پیشنهاد بدیم", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s3-01", "text": "حالا بیا همین الان یاد بگیریم چطوری به سه چهار نفر اول پیشنهاد بدیم.", "t": [0.0, 0.0699, 0.1264, 0.1963, 0.2662, 0.3227, 0.4195, 0.5028, 0.5458, 0.5888, 0.6588, 0.7152, 0.7717, 0.8819, 0.9518]}, {"id": "c5-s3-02", "text": "چرا سه تا چهار نفر؟", "t": [0.1144, 0.2803, 0.4068, 0.5332, 0.7387, 0.9047]}, {"id": "c5-s3-03", "text": "چون حرکت باید از همین لحظه شروع بشه. نه فردا. نه هفته‌ی بعد.", "t": [0.0401, 0.0981, 0.17, 0.2418, 0.286, 0.3579, 0.4297, 0.5016, 0.6199, 0.6696, 0.8043, 0.8424, 0.9161, 0.9661]}]}, {"id": "c5-s4", "ch": 5, "title": "آموزش اولین گفت‌وگو و دعوت اصولی به معارفه", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s4-01", "text": "یه گفت‌وگوی درست، چهار تا مرحله داره: داستان، تفاهم، یخ‌شکن، و دعوت به معارفه.", "t": [0.0, 0.0311, 0.1107, 0.1612, 0.2117, 0.2428, 0.303, 0.409, 0.5243, 0.6522, 0.7789, 0.8018, 0.856, 0.8893, 0.9643]}, {"id": "c5-s4-02", "text": "یک، داستان؛ داستان یعنی توضیح کامل کسب‌وکار نیست، یعنی دغدغه و احساس واقعی خودت رو با طرف در میون بذاری.", "t": [0.0368, 0.1051, 0.2233, 0.2814, 0.3233, 0.3733, 0.4152, 0.4813, 0.5232, 0.5652, 0.6151, 0.6329, 0.6829, 0.7328, 0.7748, 0.8006, 0.8264, 0.8602, 0.886, 0.9279, 0.9779]}, {"id": "c5-s4-03", "text": "دو، تفاهم؛ یعنی دغدغه‌ی مشترکتون رو نشون بدی، تا گارد طرف مقابل پایین بیاد.", "t": [0.0384, 0.1347, 0.2798, 0.335, 0.4115, 0.5092, 0.5432, 0.5984, 0.657, 0.6911, 0.7466, 0.7915, 0.8576, 0.9238, 0.9793]}, {"id": "c5-s4-04", "text": "سه، یخ‌شکن؛ یعنی یه کنجکاوی هدفمند ایجاد کنی، تا خودش بخواد بیشتر بدونه.", "t": [0.0316, 0.1387, 0.3252, 0.3829, 0.4185, 0.5095, 0.5895, 0.6583, 0.7201, 0.7502, 0.7991, 0.8574, 0.9156, 0.9739]}, {"id": "c5-s4-05", "text": "و چهار، دعوت به معارفه؛ یعنی هماهنگ کنی تا اطلاعات کامل، توی یه جلسه‌ی رسمی یا یه گردهمایی بهش منتقل بشه.", "t": [0.0253, 0.0478, 0.1275, 0.179, 0.2106, 0.3219, 0.3637, 0.4216, 0.4553, 0.4811, 0.547, 0.5888, 0.6226, 0.6483, 0.6981, 0.7399, 0.7657, 0.7914, 0.8654, 0.8991, 0.949, 0.9827]}]}, {"id": "c5-s5", "ch": 5, "title": "قدم اول: اول داستان خودت را درست بساز", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s5-01", "text": "اول از همه، داستان خودت رو درست بساز.", "t": [0.0, 0.1058, 0.1865, 0.2923, 0.4738, 0.6048, 0.6854, 0.8165, 0.9475]}, {"id": "c5-s5-02", "text": "قبل از اینکه فرصت رو به کسی پیشنهاد بدی، باید داستان خودت رو درست تعریف کنی.", "t": [0.044, 0.0941, 0.1323, 0.2064, 0.2684, 0.3066, 0.3448, 0.395, 0.4929, 0.543, 0.6051, 0.6911, 0.7532, 0.7914, 0.8534, 0.9275, 0.9776]}, {"id": "c5-s5-03", "text": "چرا؟ چون داستان تو، تفاهم می‌سازه. وقتی طرف مقابل حس کنه «تو هم مثل من فکر می‌کنی»، گاردش پایین میاد.", "t": [0.0283, 0.0656, 0.1029, 0.1669, 0.1953, 0.2504, 0.3638, 0.4135, 0.4536, 0.5128, 0.5434, 0.5835, 0.614, 0.6446, 0.6847, 0.7153, 0.7554, 0.8376, 0.8826, 0.9275, 0.9653]}, {"id": "c5-s5-04", "text": "هدف این مرحله اینه که طرف با خودش بگه: این هم مثل من دغدغه داره.", "t": [0.0433, 0.0939, 0.1444, 0.219, 0.2816, 0.3201, 0.3707, 0.4092, 0.4718, 0.5826, 0.6427, 0.6885, 0.7485, 0.7943, 0.8829, 0.9573]}, {"id": "c5-s5-05", "text": "اگه کارمندی، بعد از احوال‌پرسی بگو: «سارا، زنگ زدم بهت بگم چند وقتی بود با خودم فکر می‌کردم چقدر خوب می‌شه کنار کارم، توی وقت‌های خالیم یه درآمد اضافه داشته باشم. خودت که می‌دونی…  با یه درآمد همه‌ی مخارج جور درنمیاد.»", "t": [0.0165, 0.0355, 0.0726, 0.0916, 0.1061, 0.1523, 0.1889, 0.2268, 0.2441, 0.2615, 0.2788, 0.2961, 0.3134, 0.3348, 0.3521, 0.3653, 0.3867, 0.4041, 0.4337, 0.4552, 0.4725, 0.4939, 0.5153, 0.5368, 0.5541, 0.5837, 0.6093, 0.6225, 0.648, 0.6736, 0.6991, 0.7462, 0.7708, 0.7859, 0.8199, 0.835, 0.8501, 0.8794, 0.9039, 0.9332, 0.953, 0.9917]}, {"id": "c5-s5-06", "text": "اینجا تفاهم ایجاد می‌شه؛ چون اون هم همین دغدغه رو داره.", "t": [0.0509, 0.1537, 0.2564, 0.3592, 0.4676, 0.5348, 0.6021, 0.6534, 0.7367, 0.836, 0.8872, 0.9705]}, {"id": "c5-s5-07", "text": "اگه خونه‌داری: «سارا، چند وقتی بود حس می‌کردم حوصله‌م توی خونه سر می‌ره. از طرفی دوست داشتم درآمد مستقل داشته باشم، مثل خیلی از خانم‌های خونه‌دار که دنبال استقلال مالی‌ان.»", "t": [0.0188, 0.0439, 0.1245, 0.174, 0.1957, 0.2226, 0.2443, 0.2609, 0.2981, 0.3353, 0.357, 0.3839, 0.4005, 0.4547, 0.4721, 0.5004, 0.5287, 0.5624, 0.5961, 0.6298, 0.6636, 0.6919, 0.7147, 0.743, 0.7604, 0.805, 0.8496, 0.867, 0.9008, 0.9454, 0.9846]}, {"id": "c5-s5-08", "text": "باز هم تفاهم شکل می‌گیره.", "t": [0.1089, 0.2481, 0.3542, 0.5597, 0.6989, 0.9376]}, {"id": "c5-s5-09", "text": "اگه دانشجویی: «سارا، من خیلی دوست داشتم کنار کلاس‌های دانشگاه، هم درآمد داشته باشم، هم توی همین دوران دانشجویی یه حرفه یاد بگیرم.»", "t": [0.0217, 0.0576, 0.1623, 0.1996, 0.2226, 0.26, 0.2973, 0.3419, 0.3792, 0.4381, 0.497, 0.52, 0.5645, 0.6091, 0.6464, 0.6694, 0.6996, 0.7369, 0.7815, 0.8476, 0.8706, 0.9079, 0.9381, 0.9826]}, {"id": "c5-s5-10", "text": "اون با خودش می‌گه: این هم مثل من به آینده فکر می‌کنه.", "t": [0.0677, 0.1282, 0.1744, 0.2494, 0.3696, 0.4417, 0.4966, 0.5687, 0.6236, 0.6785, 0.7849, 0.857, 0.9634]}, {"id": "c5-s5-11", "text": "و اگه صاحب شغلی: «سارا، از قدیم گفتن همه‌ی تخم‌مرغ‌هات رو توی یه سبد نذار. من هم دوست داشتم کنار کار اصلیم، از یه مسیر دیگه هم درآمد داشته باشم.»", "t": [0.021, 0.0368, 0.067, 0.1044, 0.1688, 0.2035, 0.2249, 0.2596, 0.2942, 0.3289, 0.397, 0.4183, 0.4463, 0.4677, 0.4957, 0.5533, 0.5729, 0.5925, 0.6244, 0.6624, 0.6943, 0.72, 0.758, 0.7776, 0.7972, 0.8291, 0.861, 0.8806, 0.9186, 0.9566, 0.9885]}, {"id": "c5-s5-12", "text": "اینجا حس می‌کنه تو منطقی فکر می‌کنی، نه هیجانی.", "t": [0.0555, 0.1738, 0.2349, 0.3532, 0.4143, 0.5326, 0.6127, 0.7573, 0.8197, 0.96]}]}, {"id": "c5-s6", "ch": 5, "title": "قدم دوم: یخ‌شکن درست استفاده کن", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s6-01", "text": "بعدش، یخ‌شکن رو درست استفاده کن.", "t": [0.0, 0.1548, 0.3394, 0.4347, 0.5895, 0.8337, 0.9289]}, {"id": "c5-s6-02", "text": "حالا که تفاهم ایجاد شد، نباید مستقیم بری سراغ توضیح دادن.", "t": [0.0617, 0.1423, 0.1919, 0.288, 0.3841, 0.4337, 0.5298, 0.6414, 0.7065, 0.7871, 0.8832, 0.9638]}, {"id": "c5-s6-03", "text": "باید کاری کنی که خودش بپرسه: «چیه؟ توضیح می‌دی؟»", "t": [0.0597, 0.1459, 0.2321, 0.3018, 0.3548, 0.4411, 0.6154, 0.7957, 0.8869, 0.9634]}, {"id": "c5-s6-04", "text": "مثلا اگه طرف کارمنده: «من جدیدا یه راهی پیدا کردم که بدون اینکه کار اولت رو از دست بدی، بتونی توی وقت‌های آزادت درآمد اضافه بسازی.»", "t": [0.021, 0.0608, 0.0929, 0.125, 0.2215, 0.2438, 0.287, 0.3093, 0.3455, 0.3817, 0.4179, 0.4402, 0.4765, 0.5197, 0.5489, 0.5851, 0.6074, 0.6297, 0.659, 0.6883, 0.7315, 0.7607, 0.8109, 0.8541, 0.8973, 0.9405, 0.9836]}, {"id": "c5-s6-05", "text": "اگه خونه‌داره: «خودت خوب می‌دونی با یه منبع درآمد نمی‌شه از پس همه‌ی مخارج براومد. کار من اینه که به آدم‌ها اجازه می‌ده از داخل خونه درآمد اضافه داشته باشن.»", "t": [0.0212, 0.0486, 0.1376, 0.1686, 0.1937, 0.2366, 0.2558, 0.2749, 0.3059, 0.3429, 0.3799, 0.399, 0.4181, 0.4492, 0.4862, 0.5388, 0.5641, 0.5833, 0.6145, 0.6337, 0.653, 0.6902, 0.7275, 0.7587, 0.7779, 0.8092, 0.8404, 0.8777, 0.9149, 0.9522, 0.9834]}, {"id": "c5-s6-06", "text": "اگه دانشجوئه: «یه راهی پیدا کردم که کنار دانشگاه، بدون اینکه از وقت کلاس‌هات بزنی، بتونی توی وقت‌های اضافه‌ت درآمد داشته باشی.»", "t": [0.0278, 0.0614, 0.1614, 0.1853, 0.224, 0.2628, 0.3016, 0.3254, 0.3642, 0.4254, 0.4641, 0.5104, 0.5342, 0.5656, 0.6267, 0.6655, 0.7117, 0.743, 0.7967, 0.8504, 0.8967, 0.9429, 0.9817]}, {"id": "c5-s6-07", "text": "اینجاست که طرف می‌پرسه: «چیه؟ می‌شه توضیح بدی؟» و این دقیقا همون جاییه که وارد مرحله‌ی بعد می‌شیم.", "t": [0.0293, 0.1014, 0.1296, 0.1666, 0.2584, 0.3568, 0.3955, 0.4417, 0.51, 0.5307, 0.5701, 0.6283, 0.6771, 0.7352, 0.7653, 0.8141, 0.8816, 0.921, 0.9792]}]}, {"id": "c5-s7", "ch": 5, "title": "مرحله سوم: تنظیم قرار ملاقات", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s7-01", "text": "مرحله‌ی سوم، تنظیم قرار ملاقاته. و اینجا یه نکته‌ی خیلی مهم هست:", "t": [0.0, 0.1404, 0.2552, 0.2906, 0.3202, 0.3856, 0.4263, 0.5408, 0.6, 0.7146, 0.8107, 0.8883, 0.966]}, {"id": "c5-s7-02", "text": "قرار نیست خودت همه‌چیز رو توضیح بدی. قرار نیست پشت تلفن کل کار رو بگی.", "t": [0.0247, 0.0845, 0.1443, 0.2041, 0.2869, 0.3237, 0.3951, 0.536, 0.5992, 0.6624, 0.7134, 0.7766, 0.8155, 0.8665, 0.9054, 0.9564]}, {"id": "c5-s7-03", "text": "چون توضیح ناقص، قضاوت اشتباه می‌سازه.", "t": [0.0585, 0.1587, 0.3065, 0.4306, 0.5784, 0.7501, 0.9219]}, {"id": "c5-s7-04", "text": "پس ما قرار ملاقات می‌ذاریم. و برای این کار دو تا روش داریم: یکی قرار ملاقات تک‌به‌تک، و یکی گردهمایی خونگی؛ یعنی افتتاحیه‌ی کسب‌وکارت.", "t": [0.0206, 0.0393, 0.0579, 0.0882, 0.1301, 0.2084, 0.2192, 0.2447, 0.2653, 0.2859, 0.3016, 0.3173, 0.3379, 0.398, 0.4334, 0.4773, 0.538, 0.6171, 0.6334, 0.6645, 0.7327, 0.8056, 0.8436, 0.9183, 0.9857]}]}, {"id": "c5-s8", "ch": 5, "title": "قرار ملاقات تک ب تک", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s8-01", "text": "روش اول، قرار ملاقات تک‌به‌تکه. هدفش اینه که اطلاعات کامل، توی یه جلسه‌ی رسمی‌تر منتقل بشه.", "t": [0.0, 0.0637, 0.144, 0.2008, 0.2794, 0.399, 0.4505, 0.502, 0.5337, 0.6149, 0.6664, 0.708, 0.7397, 0.8011, 0.8724, 0.9338, 0.9754]}, {"id": "c5-s8-02", "text": "چرا؟ چون اگه همون اول بگی «کار ما فروش محصولات نفیسه»، ممکنه ویزیتوری بیاد توی ذهنش.", "t": [0.0334, 0.1507, 0.1942, 0.2378, 0.2917, 0.3352, 0.3787, 0.4223, 0.4554, 0.5093, 0.5943, 0.6586, 0.7229, 0.8182, 0.8721, 0.9157, 0.9696]}, {"id": "c5-s8-03", "text": "اگه بگی «بیا تیمت رو بساز»، ممکنه یاد شرکت‌های هرمی بیفته. در حالی که کار ما سالم و مجوزدار و سیستمیه.", "t": [0.0291, 0.0683, 0.1075, 0.1467, 0.1953, 0.2252, 0.2889, 0.3422, 0.3783, 0.4488, 0.4935, 0.5875, 0.6149, 0.6595, 0.6869, 0.7228, 0.7502, 0.7947, 0.8136, 0.8838, 0.9026, 0.9728]}, {"id": "c5-s8-04", "text": "پس دعوت اصولی این شکلیه:", "t": [0.1223, 0.2234, 0.3877, 0.5835, 0.7162, 0.9121]}, {"id": "c5-s8-05", "text": "«من فردا یا این هفته با پشتیبانم، که کمکم کرده کارم رو شروع کنم، یه قرار نیم‌ساعته دارم. می‌تونم هماهنگ کنم تو هم بیای اطلاعات کامل بگیری.", "t": [0.0221, 0.045, 0.0821, 0.1049, 0.1349, 0.1721, 0.1949, 0.2606, 0.2835, 0.3206, 0.3578, 0.3949, 0.4178, 0.4549, 0.4849, 0.5078, 0.5449, 0.6106, 0.6788, 0.7229, 0.767, 0.7928, 0.8124, 0.832, 0.8638, 0.9141, 0.9459, 0.9839]}, {"id": "c5-s8-06", "text": "چون پشت تلفن نمی‌شه اطلاعاتی که بهت کمک کنه رو کامل توضیح داد. می‌خوای هماهنگ کنم تو هم باشی؟ هم یه چایی با هم می‌خوریم، هم اطلاعات می‌گیری.»", "t": [0.0215, 0.0502, 0.0789, 0.1145, 0.1569, 0.2198, 0.2416, 0.2704, 0.2991, 0.3278, 0.3497, 0.3852, 0.4276, 0.4672, 0.519, 0.5707, 0.6008, 0.6238, 0.6468, 0.7107, 0.7295, 0.7483, 0.7789, 0.7977, 0.8165, 0.8646, 0.8834, 0.9316, 0.9739]}, {"id": "c5-s8-07", "text": "و مهم‌ترین جمله، جمله‌ی طلایی‌ای که فشار رو برمی‌داره:", "t": [0.0559, 0.0944, 0.2379, 0.3289, 0.4373, 0.5808, 0.6368, 0.7278, 0.7838, 0.9447]}, {"id": "c5-s8-08", "text": "«هیچ فشاری روت نیست. توضیحات رو گوش بده؛ اگه خوشت اومد استفاده کن، اگه هم موقعیتش رو نداشتی، من ناراحت نمی‌شم.»", "t": [0.0329, 0.073, 0.132, 0.172, 0.2542, 0.3108, 0.333, 0.362, 0.4162, 0.4475, 0.4863, 0.5251, 0.5862, 0.6387, 0.6717, 0.6968, 0.7612, 0.7863, 0.8429, 0.868, 0.9245, 0.9732]}, {"id": "c5-s8-09", "text": "این جمله فشار رو برمی‌داره، و جذابیت ایجاد می‌کنه.", "t": [0.062, 0.1368, 0.2294, 0.322, 0.3789, 0.5737, 0.6127, 0.7403, 0.8502, 0.96]}]}, {"id": "c5-s9", "ch": 5, "title": "گردهمایی خانگی (افتتاحیه کسب‌وکار)", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s9-01", "text": "روش دوم، گردهمایی خونگیه؛ یعنی افتتاحیه‌ی کسب‌وکارت.", "t": [0.0, 0.0919, 0.1839, 0.3852, 0.5836, 0.6672, 0.8312, 0.9791]}, {"id": "c5-s9-02", "text": "این روش، سرعت اولین بله‌ها رو بالا می‌بره.", "t": [0.0427, 0.1368, 0.2308, 0.3472, 0.4861, 0.6249, 0.6965, 0.813, 0.9518]}, {"id": "c5-s9-03", "text": "چرا؟ چون انرژی جمعی اثر داره. چون توی یه ساعت، به چند نفر توضیح می‌دی. و چون وقتت ذخیره می‌شه.", "t": [0.0268, 0.0957, 0.1435, 0.2141, 0.2733, 0.3211, 0.4127, 0.4488, 0.4849, 0.5124, 0.5571, 0.5846, 0.6208, 0.6569, 0.7102, 0.7777, 0.7967, 0.8331, 0.8782, 0.9319, 0.977]}, {"id": "c5-s9-04", "text": "مثلا به دوستای معمولیت بگو: «برای شروع کارم، چهارشنبه یه افتتاحیه توی خونه برگزار می‌کنم. دوستام رو دعوت کردم بیان. اگه وقت داری، خوشحال می‌شم تو هم کنارم باشی.", "t": [0.0212, 0.053, 0.0726, 0.1166, 0.1668, 0.2037, 0.2344, 0.265, 0.2956, 0.3498, 0.3686, 0.4228, 0.4475, 0.4782, 0.5206, 0.5663, 0.6096, 0.6288, 0.6601, 0.6913, 0.7226, 0.7478, 0.7731, 0.8043, 0.8476, 0.8789, 0.8981, 0.9173, 0.9546, 0.9858]}, {"id": "c5-s9-05", "text": "هم همدیگه رو می‌بینیم، هم یه چایی می‌خوریم، هم درباره‌ی کار جدیدم اطلاعات می‌گیری.»", "t": [0.0353, 0.0726, 0.1565, 0.1937, 0.2892, 0.3265, 0.3637, 0.4243, 0.5198, 0.557, 0.6525, 0.7014, 0.7736, 0.8691, 0.9529]}, {"id": "c5-s9-06", "text": "یا به آدمای نزدیک‌تر بگو: «واسه شروع کارم افتتاحیه گرفتم. اگه بیای، هم از من حمایت کردی، هم می‌بینی خودت چطوری می‌تونی درآمد داشته باشی.»", "t": [0.0296, 0.049, 0.0685, 0.1063, 0.1562, 0.1965, 0.2367, 0.2768, 0.317, 0.3881, 0.4677, 0.4953, 0.5296, 0.5507, 0.5718, 0.5928, 0.6337, 0.668, 0.689, 0.7365, 0.7707, 0.8116, 0.859, 0.8999, 0.9407, 0.975]}, {"id": "c5-s9-07", "text": "یه نکته‌ی مهم: اگه می‌خوای ده تا مهمون قطعی داشته باشی، حداقل با بیست نفر تماس بگیر. چون بعضی‌ها اون موقع وقت ندارن.", "t": [0.0351, 0.0559, 0.0962, 0.1549, 0.1909, 0.2526, 0.2801, 0.3075, 0.3607, 0.4053, 0.4584, 0.503, 0.5562, 0.5836, 0.6282, 0.6642, 0.7088, 0.784, 0.8099, 0.8544, 0.8804, 0.9125, 0.9384, 0.9767]}, {"id": "c5-s9-08", "text": "و خیلی مهم: چه تک‌به‌تک، چه گروهی، یه روز قبلش حضورش رو قطعی کن، و روز معارفه هم یادآوری کن.", "t": [0.0312, 0.0502, 0.0953, 0.1507, 0.1548, 0.1797, 0.2594, 0.4283, 0.4595, 0.5004, 0.551, 0.6114, 0.6425, 0.6931, 0.737, 0.7551, 0.7897, 0.849, 0.8754, 0.9429, 0.9693]}, {"id": "c5-s9-09", "text": "پس جمع‌بندی مسیر گفت‌وگو این شد:", "t": [0.101, 0.1863, 0.4049, 0.5436, 0.7355, 0.8475, 0.9328]}, {"id": "c5-s9-10", "text": "یک، اول داستانت رو بگو و تفاهم بساز.", "t": [0.0606, 0.1358, 0.2384, 0.4387, 0.5168, 0.6194, 0.6732, 0.8246, 0.9516]}, {"id": "c5-s9-11", "text": "دو، با یه یخ‌شکن درست، کاری کن خودش بخواد براش توضیح بدی.", "t": [0.0478, 0.187, 0.2328, 0.2787, 0.3675, 0.442, 0.5165, 0.5624, 0.6369, 0.7257, 0.8002, 0.8891, 0.9493]}, {"id": "c5-s9-12", "text": "سه، به جای اینکه کامل توضیح بدی، دعوتش کن به یه قرار ملاقات تک‌به‌تک یا گردهمایی خونگی.", "t": [0.0328, 0.136, 0.1636, 0.1999, 0.2534, 0.2983, 0.3519, 0.4062, 0.4713, 0.5048, 0.5384, 0.572, 0.6265, 0.7021, 0.7776, 0.8111, 0.9077, 0.9727]}, {"id": "c5-s9-13", "text": "و چهار، حضورش رو قطعی کن.", "t": [0.0945, 0.1642, 0.4349, 0.6119, 0.7033, 0.8518, 0.9432]}]}, {"id": "c5-s10", "ch": 5, "title": "قطعی کردن و پیگیری بعد از معارفه", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s10-01", "text": "بعد از معارفه، نوبت قطعی کردن و پیگیریه. قطعی کردن دو تا هدف داره.", "t": [0.0, 0.0627, 0.1105, 0.218, 0.2957, 0.3733, 0.4509, 0.4838, 0.6599, 0.7221, 0.7842, 0.8225, 0.8607, 0.9109, 0.9731]}, {"id": "c5-s10-02", "text": "هدف اول اینه که فشار رو از روی پراسپکت برداری.", "t": [0.0709, 0.1481, 0.2252, 0.3208, 0.3796, 0.4751, 0.5339, 0.5927, 0.6698, 0.8205, 0.9528]}, {"id": "c5-s10-03", "text": "بدتر از نه شنیدن، اینه که بگه «بعدا خبرت می‌کنم».", "t": [0.065, 0.1626, 0.2227, 0.2828, 0.3993, 0.4969, 0.557, 0.6359, 0.7335, 0.8312, 0.9476]}, {"id": "c5-s10-04", "text": "باید اون‌قدر به کارت ایمان داشته باشی که بدونی اگه جوابش نه باشه، به ضرر تو نیست.", "t": [0.0498, 0.1085, 0.1898, 0.226, 0.2847, 0.3547, 0.4247, 0.4835, 0.5196, 0.5896, 0.6371, 0.7071, 0.7432, 0.802, 0.8381, 0.8855, 0.9217, 0.9804]}, {"id": "c5-s10-05", "text": "برزخ از جهنم بدتره؛ یا بله، یا نه.", "t": [0.0676, 0.1924, 0.2692, 0.394, 0.5817, 0.6195, 0.7713, 0.8856, 1.0]}, {"id": "c5-s10-06", "text": "هدف دوم اینه که کمکش کنیم از ترس‌ها و ناامنی‌هاش عبور کنه، و با آگاهی و آرامش تصمیم بگیره.", "t": [0.0203, 0.0648, 0.1092, 0.1642, 0.1981, 0.2531, 0.3081, 0.3419, 0.4075, 0.4308, 0.5387, 0.5937, 0.6382, 0.6614, 0.6953, 0.7609, 0.7842, 0.8498, 0.9153, 0.9809]}, {"id": "c5-s10-07", "text": "برای همین بعد از معارفه، از این پنج تا سؤال طلایی استفاده کن، تا مسیر تصمیم‌گیری براش روشن بشه:", "t": [0.0346, 0.0856, 0.1366, 0.1778, 0.2092, 0.2798, 0.3112, 0.3524, 0.3935, 0.4249, 0.4759, 0.5367, 0.6171, 0.6485, 0.6799, 0.7309, 0.8309, 0.8819, 0.9329, 0.9741]}, {"id": "c5-s10-08", "text": "«کدوم قسمت صحبت‌ها باعث می‌شه از این فرصت استفاده کنی؟»", "t": [0.0748, 0.1618, 0.2487, 0.369, 0.456, 0.5429, 0.5964, 0.6666, 0.7535, 0.8906, 0.9608]}, {"id": "c5-s10-09", "text": "«خب، تا اینجاش رو فهمیدی؛ دیگه چی می‌خوای بدونی؟»", "t": [0.078, 0.1395, 0.201, 0.3393, 0.4008, 0.5792, 0.6694, 0.7249, 0.8498, 0.9574]}, {"id": "c5-s10-10", "text": "«سؤالی هست که بخوای بپرسی؟»", "t": [0.1156, 0.3108, 0.443, 0.5437, 0.7389, 0.934]}, {"id": "c5-s10-11", "text": "«دوست داری بدونی قدم بعدی چیه؟»", "t": [0.0974, 0.2412, 0.385, 0.5564, 0.6725, 0.8163, 0.9325]}, {"id": "c5-s10-12", "text": "«دوست داری من چی‌کار کنم که تصمیم بهتری بگیری؟»", "t": [0.0723, 0.1739, 0.2755, 0.338, 0.4591, 0.5411, 0.6036, 0.7247, 0.8458, 0.9669]}]}, {"id": "c5-s11", "ch": 5, "title": "عادت روزانه و برنامهٔ اولین اقدام", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s11-01", "text": "از این به بعد، این کار باید برات عادت بشه.", "t": [0.0, 0.0688, 0.1591, 0.2279, 0.3182, 0.4085, 0.4989, 0.6107, 0.7225, 0.8343, 0.9246]}, {"id": "c5-s11-02", "text": "روزی به دو یا سه نفر فرصت رو پیشنهاد بده.", "t": [0.0644, 0.1699, 0.2348, 0.2997, 0.3646, 0.4295, 0.5148, 0.6202, 0.6852, 0.8515, 0.9367]}, {"id": "c5-s11-03", "text": "این کار توی یه روز انجام نمی‌شه؛ با استمرار ساخته می‌شه.", "t": [0.0457, 0.1062, 0.1667, 0.2271, 0.2732, 0.3337, 0.4229, 0.5702, 0.6242, 0.7628, 0.8675, 0.9553]}, {"id": "c5-s11-04", "text": "پس این سه تا عدد یادت باشه: روزی دو تا سه تماس. لیست پویایی که همیشه بیست نفر توشه. و ورودی قیفی که معمولا پنجاه تا هفتاد تا گفت‌وگوئه.", "t": [0.0167, 0.0343, 0.0574, 0.075, 0.0926, 0.1157, 0.1443, 0.2008, 0.2406, 0.2651, 0.2896, 0.3141, 0.3808, 0.4133, 0.4584, 0.4784, 0.5172, 0.5498, 0.576, 0.6354, 0.6499, 0.6906, 0.7248, 0.7458, 0.7932, 0.8339, 0.855, 0.8957, 0.9168, 0.9773]}, {"id": "c5-s11-05", "text": "حالا بگو: از توی لیستت، اولین تماس رو با کی می‌گیری؟", "t": [0.0565, 0.1547, 0.2341, 0.2945, 0.3739, 0.5231, 0.6157, 0.6934, 0.7412, 0.7889, 0.8367, 0.9443]}, {"id": "c5-s11-06", "text": "بیا همین الان، تماس‌های اولت رو بگیر.", "t": [0.0819, 0.1809, 0.3033, 0.4258, 0.6189, 0.7414, 0.8168, 0.9392]}]}, {"id": "c5-s12", "ch": 5, "title": "پایان سفر و آغاز واقعی", "eyebrow": "فصل پنجم · لحظهٔ حرکت", "lines": [{"id": "c5-s12-01", "text": "تو دیگه فقط ثبت‌نام نکردی.", "t": [0.0, 0.1163, 0.3052, 0.4578, 0.7194, 0.9446]}, {"id": "c5-s12-02", "text": "تو شروع کردی.", "t": [0.1071, 0.3006, 0.615, 0.9294]}, {"id": "c5-s12-03", "text": "هر پنج فصل نقشه‌ی راهت کامل شد: تعهد به آموزش، دلیل شخصیت، هدف دقیقت، لیست بیست‌نفره‌ت، و مهارت اولین گفت‌وگوها.", "t": [0.0139, 0.0376, 0.0687, 0.0998, 0.1456, 0.1841, 0.2226, 0.2564, 0.3063, 0.337, 0.3966, 0.4465, 0.5061, 0.5464, 0.606, 0.6559, 0.7539, 0.7751, 0.8346, 0.8942, 0.9825]}, {"id": "c5-s12-04", "text": "حالا وقت حرکت توی دنیای واقعیه.", "t": [0.0659, 0.2091, 0.3247, 0.4679, 0.5836, 0.7543, 0.9526]}, {"id": "c5-s12-05", "text": "آموزش تموم شد؛ حالا وقتشه نگرش‌ها و هدف‌هات رو به اولین گفت‌وگوهای واقعی تبدیل کنی.", "t": [0.0272, 0.1003, 0.1617, 0.2138, 0.2731, 0.3438, 0.4258, 0.4509, 0.533, 0.5695, 0.606, 0.6767, 0.793, 0.8637, 0.9343, 0.9822]}, {"id": "c5-s12-06", "text": "و یادت باشه: سفر تو با تصمیم شروع می‌شه، و با اقدام معنا پیدا می‌کنه.", "t": [0.0293, 0.0539, 0.1122, 0.1899, 0.2648, 0.3218, 0.3788, 0.4893, 0.5819, 0.6918, 0.7128, 0.7434, 0.8026, 0.8524, 0.9021, 0.9613]}]}], "chapters": [{"title": "دروازهٔ شروع", "sub": "اهمیت آموزش‌پذیری و پایبندی به سیستم", "end": "من تصمیم گرفته‌ام آموزش ببینم، به سیستم پایبند باشم و چیزی را که یاد می‌گیرم اجرا کنم."}, {"title": "کشف فرصت", "sub": "چرا نتورک مارکتینگ؟", "end": "من ۵ ظرفیت واقعی این حرفه را کشف کردم و دلایل شخصی خودم را برای انتخاب و ادامهٔ این مسیر می‌دانم."}, {"title": "قلهٔ هدف", "sub": "هدفمند شوید", "end": "من با نوشتن هدف مشخص و دقیق، به گروه ۳٪ پیوسته‌ام و حاضرم هر روز بهای آن را با اقدام متمرکز بپردازم."}, {"title": "میدان انتخاب", "sub": "لیست — نگرش‌ها و قوانین اصلی", "end": "من بدون قضاوت کردن افراد، لیست پویای ۲۰ نفره‌ام آماده است و با تعداد اقدام بالا و بدون وابستگی به نتیجه حرکت می‌کنم."}, {"title": "لحظهٔ حرکت", "sub": "اقدام عملی و آموزش اولین گفت‌وگوها", "end": "من دیگر فقط ثبت‌نام نکرده‌ام؛ من شروع کرده‌ام."}], "have": {"v": ["IDLE1", "IDLE2", "IDLE3", "intro-1-01", "intro-1-02", "intro-1-03", "intro-1-04", "intro-1-05", "intro-2-01", "intro-2-02", "intro-2-03", "intro-2-04", "intro-2-05", "intro-2-06", "intro-3-01", "intro-3-02", /* ---------- interactions at the end of a scene ---------- */
function sheet(html, onMount) {
  return new Promise(resolve => {
    const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = `<div class="box">${html}</div>`;
    document.body.appendChild(s);
    const close = v => { s.remove(); resolve(v); };
    onMount(s, close);
  });
}
/* every sheet goes on by itself: 5..1 next to the buttons; a tap restarts the count. Typing sheets (idleMs) hold the
   count while the viewer types and start it again once they have been idle that long; at 0 what was typed is saved. */
function sheetCd(s, done, idleMs = 0) {
  const acts = s.querySelector('.acts'); acts.insertAdjacentHTML('beforeend', '<span class="scd"><b></b><i></i></span>');
  const b = acts.querySelector('.scd b'), bar = acts.querySelector('.scd i'); let left = 5, last = 0;
  const paint = () => { b.textContent = fa(left); bar.style.transform = `scaleX(${(5 - left) / 5})`; };
  paint();
  if (idleMs) ['input', 'keydown', 'focusin', 'pointerdown'].forEach(e => s.addEventListener(e, () => { last = Date.now(); left = 5; paint(); }, true));
  const t = setInterval(() => {
    if (!s.isConnected) { clearInterval(t); return; }
    if (paused) return;
    if (idleMs && Date.now() - last < idleMs) return;  // still typing: hold
    left--; if (left <= 0) { clearInterval(t); done(); return; }
    paint(); sfx('tick', .06);
  }, 1000);
  return { reset() { left = 5; paint(); } };
}

      s.querySelector('[data-ok]').onclick = () => { S.ans[key] = ins.map(x => x.value.trim()).filter(Boolean); save(); close(); };
      s.querySelector('[data-skip]').onclick = () => close();
      sheetCd(s, () => s.querySelector('[data-ok]').click(), 4000);
    });
  } else if (a.k === 'chess') {
    await sheet(`<h3>${esc(a.q)}</h3><p class="hint">هر خانه را لمس کن. فقط یکی‌شان ۱۰ میلیارد است.</p><div class="game"><div class="bd">${Array.from({length: 64}, (_, i) =>
      `<button class="sq ${(Math.floor(i / 8) + i) % 2 ? 'd' : 'l'}" type="button" data-i="${i}"></button>`).join('')}</div></div><p class="hint" data-r>تعداد انتخاب: ۰</p>
      <div class="acts"><button class="btn" type="button" data-ok>ادامه</button></div>`, (s, close) => {
      const gold = Math.floor(Math.random() * 64); let n = 0, won = false;
      s.querySelectorAll('.sq').forEach(b => b.onclick = () => {
        if (won || b.classList.contains('x')) return; n++;
        if (+b.dataset.i === gold) { won = true; b.classList.add('win'); b.innerHTML = svg('coin', 2.2); sfx('ding', .4);
          s.querySelector('[data-r]').innerHTML = `پیدا شد! با <b>${fa(n)}</b> انتخاب. اگر فقط ۵ انتخاب داشتی، شانست ${fa(Math.round(5 / 64 * 100))}٪ بود؛ هرچه بیشتر حرکت کنی، احتمال برد بیشتر است.`;
          S.ans.chess = n; save(); }
        else { b.classList.add('x'); b.textContent = '✕'; sfx('tick', .12); s.querySelector('[data-r]').textContent = `تعداد انتخاب: ${fa(n)}`; }
      });
      s.querySelector('[data-ok]').onclick = () => close();
      const cd = sheetCd(s, () => close());
      s.querySelectorAll('.sq').forEach(q => q.addEventListener('click', () => cd.reset()));
    });
  } else if (a.k === 'first') {
    const names = S.ans.names || [], f = prev || {};
    await sheet(`<h3>${esc(a.q)}</h3><p class="hint">روزی به ۲ یا ۳ نفر فرصت را پیشنهاد بده. اولین تماس همین الان است.</p>
      ${names.length ? `<div class="chips">${names.slice(0, 20).map(n => `<button class="chip" type="button">${esc(n)}</button>`).join('')}</div>` : ''}
      <label class="f">اسم اولین نفر</label><input type="text" data-f="who" value="${esc(f.who || '')}" placeholder="اسم">
      <label class="f">کِی تماس می‌گیری؟</label><select data-f="when">${['همین الان', 'تا یک ساعت دیگر', 'امروز عصر', 'فردا صبح'].map(o => `<option ${f.when === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
      <div class="acts"><button class="btn" type="button" data-ok>قول می‌دهم</button>${skip}</div>`, (s, close) => {
      const who = s.querySelector('[data-f=who]');
      s.querySelectorAll('.chip').forEach(c => c.onclick = () => { who.value = c.textContent; s.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); sfx('tick', .2); });
      s.querySelector('[data-ok]').onclick = () => { if (who.value.trim()) { S.ans[key] = {who: who.value.trim(), when: s.querySelector('[data-f=when]').value}; save(); sfx('ding', .35); } close(); };
      s.querySelector('[data-skip]').onclick = () => close();
      sheetCd(s, () => s.querySelector('[data-ok]').click(), 4000);
    });
  }
}

/* ---------- player ---------- */
const nextB = $('#next'), segs = $('#segs');
let waitNext = null;
function chapterGroups(ch) { return G.filter(g => g.ch === ch); }
function paintSegs(gi, frac) {
  const g = G[gi], list = chapterGroups(g.ch);
  if (segs.dataset.ch !== String(g.ch)) { segs.dataset.ch = g.ch; segs.innerHTML = list.map(() => '<i></i>').join(''); }
  [...segs.children].forEach((s, i) => { const k = GI[list[i].id]; s.style.setProperty('--p', k < gi ? 1 : k === gi ? frac : 0); });
}
function setScene(g) {
  const sc = $('#scene'); if (sc.dataset.g === g.id) return; sc.dataset.g = g.id;
  $('#eyebrow').textContent = g.eyebrow; $('#stitle').innerHTML = maskWords(g.title, .15, .06);
  sc.classList.remove('anim'); void sc.offsetWidth; sc.classList.add('anim');
}
async function runGroup(gi) {
  const my = ++seq, g = G[gi]; S.pos = gi; save();
  setScene(g); nextB.classList.remove('wait'); beatSig = null;
  if (beatEl) { const old = beatEl; old.classList.add('out'); setTimeout(() => old.remove(), 380); beatEl = null; }
  const beats = V[g.id] || [];
  for (let i = 0; i < g.lines.length; i++) {
    if (my !== seq) return;
    cueLine(g.lines[i]);
    showBeat(beats[i] || null);
    paintSegs(gi, i / g.lines.length);
    preload(g, i);
    await playLine(g.lines[i]);
    while (paused && my === seq) await new Promise(r => setTimeout(r, 150));
    if (my !== seq) return;
    // no gap between lines: the next clip is already loaded in the spare player
  }
  paintSegs(gi, 1);
  if (my !== seq) return;
  S.done[g.id] = 1; save();
  await ask(g.id);
  if (my !== seq) return;
  if (gi === G.length - 1) { finale(); return; }
  // one flow (Amir): a scene without a question goes straight on — no 5..1 wait between scenes; only the question
  // sheets count 5..1 (sheetCd) before going on by themselves
  if (my === seq) runGroup(gi + 1);
}
/* 5-4-3-2-1 on the Next button, then it goes on by itself. Runs only after ask() resolved, so a typing or choosing
   sheet never auto-advances; it holds while paused. */
let cdT = null;
function stopCd() { clearInterval(cdT); cdT = null; nextB.classList.remove('cd'); nextB.style.setProperty('--cd', 0); }
function startCd(done) {
  stopCd(); let left = 5;
  if (!nextB.querySelector('.cdn')) nextB.insertAdjacentHTML('afterbegin', '<b class="cdn"></b>');
  const paint = () => { const n = nextB.querySelector('.cdn'); n.textContent = fa(left); n.style.animation = 'none'; void n.offsetWidth; n.style.animation = '';
    nextB.style.setProperty('--cd', (5 - left + 1) / 5); };
  nextB.style.setProperty('--cd', 0); nextB.classList.add('cd'); requestAnimationFrame(paint);
  cdT = setInterval(() => {
    if (paused || document.querySelector('.sheet, .map, .final')) return;
    left--; if (left <= 0) { stopCd(); done(); return; }
    paint(); sfx('tick', .08);
  }, 1000);
}
/* load the next line's clip into the spare player (the one playLine will use next), after this line's cross-fade,
   already seeked to its first word — so the next line starts instantly, with no buffering gap */
function preload(g, i) {
  const n = g.lines[i + 1] || (G[GI[g.id] + 1] || {lines: []}).lines[0]; if (!n) return;
  if (!HV.has(n.id)) { if (HA.has(n.id)) { const a = new Audio(); a.preload = 'auto'; a.src = `media/a/${n.id}.mp3`; } return; }
  const my = seq;
  setTimeout(() => {
    if (my !== seq) return;
    const spare = TV[tvi ^ 1]; if (spare === curEl || spare.dataset.id === n.id) return;
    spare.classList.remove('cur'); spare.dataset.id = n.id; spare.preload = 'auto'; spare.src = `media/v/${n.id}.mp4`; spare.load();
    const lead = (n.t || [0])[0];
    spare.addEventListener('loadedmetadata', () => { if (spare.dataset.id === n.id && lead > 0) spare.currentTime = Math.max(0, lead * spare.duration - .05); }, {once: true});
  }, 700);
}
function go(gi) { stopCd(); seq++; halt(); paused = false; setPP(); waitNext = null; capEl.innerHTML = ''; runGroup(Math.max(0, Math.min(G.length - 1, gi))); }
nextB.onclick = () => { sfx('tap', .25); stopCd(); if (waitNext) { const r = waitNext; waitNext = null; r(); } else go(S.pos + 1); };
$('#prev').onclick = () => { sfx('tap', .25); go(S.pos - 1); };
$('#again').onclick = () => { sfx('tap', .25); go(S.pos); };
function setPP() { $('#pp').innerHTML = svg(paused ? 'play' : 'pause'); }
$('#pp').onclick = () => { paused = !paused; setPP(); if (curEl) paused ? curEl.pause() : curEl.play().catch(() => {}); };
const SPEEDS = [1.1, 1.25, 1.4, 1];
$('#speed').onclick = () => { rate = SPEEDS[(SPEEDS.indexOf(rate) + 1) % SPEEDS.length]; $('#speed').textContent = fa(rate).replace('.', '٫') + '×'; if (curEl) curEl.playbackRate = rate; };
function setMute() { $('#mute').innerHTML = svg(muted ? 'muted' : 'sound'); }
$('#mute').onclick = () => { muted = !muted; setMute(); music.muted = muted; setMusic(musicT); TV.forEach(v => v.muted = muted); if (curEl) curEl.muted = muted; };
$('#prev').innerHTML = svg('back'); $('#again').innerHTML = svg('redo'); $('#mapb').innerHTML = svg('grid'); nextB.insertAdjacentHTML('beforeend', svg('fwd')); setPP(); setMute();
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select')) return; if (e.key === ' ') { e.preventDefault(); $('#pp').click(); } if (e.key === 'ArrowLeft') nextB.click(); if (e.key === 'ArrowRight') $('#prev').click(); });

/* ---------- journey map ---------- */
$('#mapb').onclick = () => {
  const m = document.createElement('div'); m.className = 'map';
  const secs = [{n: 0, title: 'مقدمه', sub: 'تبریک، ثبت‌نام یا شروع، اهداف'}].concat(DATA.chapters.map((c, i) => ({n: i + 1, title: c.title, sub: c.sub})));
  m.innerHTML = `<button class="ib" type="button" style="position:fixed;top:14px;left:14px" data-x>${svg('x')}</button><h2>نقشه‌ی سفر</h2>` + secs.map(c => {
    const gs = G.filter(g => g.ch === c.n), d = gs.filter(g => S.done[g.id]).length;
    return `<div class="chap glass"><div class="hh"><div class="ico">${svg(['flag', 'compass', 'spark', 'mountain', 'list', 'rocket'][c.n])}</div><div><div class="k">${c.n ? 'فصل ' + fa(c.n) : 'شروع'}</div><div class="tt">${esc(c.title)}</div><div class="hint" style="margin:0">${esc(c.sub || '')}</div></div></div>
      <div class="bar"><i style="width:${Math.round(d / gs.length * 100)}%"></i></div><div class="sc">${gs.map(g => `<button type="button" class="${S.done[g.id] ? 'done' : ''}" data-g="${GI[g.id]}">${esc(g.title)}</button>`).join('')}</div></div>`;
  }).join('');
  document.body.appendChild(m);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { m.remove(); go(+b.dataset.g); });
};

/* ---------- finale: the action portfolio ---------- */
function finale() {
  const A = S.ans, f = document.createElement('div'); f.className = 'final';
  const item = (k, v) => v ? `<div class="item glass"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>` : '';
  f.innerHTML = `<div class="medal" style="margin:10px auto 14px">${svg('crown', 2)}</div><h1>تو شروع کرده‌ای.</h1><p>این پرونده‌ی اقدام توست؛ آن را برای پشتیبانت بفرست یا چاپ کن.</p>
    ${item('تعهد آموزش', A.commit)}${item('دلیل‌های شخصی', (A.why || []).join('، '))}
    ${A.goal ? item('هدف دقیق', `عدد: ${A.goal.num || '—'} · تا: ${A.goal.time || '—'}\n${A.goal.res || ''}`) : ''}${item('ساعت فعالیت روزانه', A.hours)}
    ${item('لیست پویا', (A.names || []).length ? `${fa(A.names.length)} نفر: ${A.names.join('، ')}` : '')}${A.first ? item('اولین تماس', `${A.first.who} — ${A.first.when}`) : ''}
    <div class="acts" style="justify-content:center"><button class="btn" type="button" data-p>چاپ / ذخیره PDF</button><button class="lnk" type="button" data-m>نقشه‌ی سفر</button></div>`;
  document.body.appendChild(f); sfx('ding', .45);
  f.querySelector('[data-p]').onclick = () => window.print();
  f.querySelector('[data-m]').onclick = () => { f.remove(); $('#mapb').click(); };
}


/* ---------- gold dust (slow, sparse, behind the board) ---------- */
(() => {
  const c = $('#dust'), x = c.getContext('2d'); let W, H; const N = 46, ps = [];
  const fit = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  fit(); addEventListener('resize', fit);
  for (let i = 0; i < N; i++) ps.push({x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8, v: .00012 + Math.random() * .0004, a: Math.random() * 6.28});
  const tick = () => { x.clearRect(0, 0, W, H);
    for (const p of ps) { p.y -= p.v; p.a += .01; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      const px = (p.x + Math.sin(p.a) * .01) * W, py = p.y * H, al = .25 + .35 * Math.sin(p.a * 1.7) ** 2;
      x.beginPath(); x.arc(px, py, p.r * devicePixelRatio, 0, 6.28); x.fillStyle = `rgba(244,212,147,${al})`; x.fill(); }
    requestAnimationFrame(tick); };
  tick();
})();


/* ---------- reel gestures (almost every viewer is on a phone): swipe ← next, swipe → previous, tap the narrator = pause ---------- */
(() => {
  let x0 = 0, y0 = 0, t0 = 0;
  const stage = $('#stage');
  stage.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, {passive: true});
  stage.addEventListener('touchend', e => {
    if (e.target.closest('button,input,textarea,select,.sheet,.map,.final,.screen')) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 700) { dx < 0 ? nextB.click() : $('#prev').click(); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 350 && e.target.closest('#pres')) $('#pp').click();
  }, {passive: true});
  $('#pres').addEventListener('click', e => { if (!('ontouchstart' in window)) $('#pp').click(); });
})();

/* ---------- boot ---------- */
function boot() {
  const resumable = S && S.pos > 0;
  const b = document.createElement('div'); b.className = 'screen';
  b.innerHTML = `<div class="kick">آموزش تعاملی · فست استارت</div><h1>شروع سریع<br>سیستم اقدام حرفه‌ای</h1>
    <p>یک مربی، روبه‌روی تو. پنج فصل کوتاه تا اولین گفت‌وگوهای واقعی. صدای دستگاهت را روشن کن.</p>
    <div class="acts">${resumable ? '<button class="btn" type="button" data-c>ادامه از همان‌جا</button><button class="lnk" type="button" data-n>از اول</button>' : '<button class="btn" type="button" data-n>شروع</button>'}</div>`;
  document.body.appendChild(b);
  const start = pos => { b.remove(); if (DATA.music) { music.src = 'media/music/bed.mp3'; music.volume = 0; audioInit(); music.play().catch(() => {}); setMusic(BED); }
    if (IDLES.length) idleV.play().catch(() => {}); go(pos); };
  b.querySelector('[data-n]').onclick = () => { S = fresh(); save(); start(0); };
  if (resumable) b.querySelector('[data-c]').onclick = () => start(S.pos);
}
if (!S) S = fresh();
boot();
</script>
